name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile agent/*.py
          python -m py_compile app/*.py

      - name: Validate project imports
        env:
          GROQ_API_KEY: test-key
        run: |
          python -c "import pandas, numpy, sklearn, lightgbm, joblib, streamlit, plotly"
          python -c "from agent.tool import get_customer_profile"
          python -c "from agent.agent import ask_agent"

      - name: Install testing dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run automated tests
        env:
          GROQ_API_KEY: test-key
        run: |
          pytest -v --cov=agent --cov=app --cov-report=term-missing